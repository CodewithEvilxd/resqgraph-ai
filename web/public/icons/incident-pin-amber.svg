<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 76" width="60" height="76">
  <defs>
    <filter id="pin-drop-shadow-amber" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.32" />
    </filter>
  </defs>

  <!-- Ground Ripples / Radar Waves beneath the needle tip (Split-tone amber) -->
  <!-- Outer Ripple Arc -->
  <g>
    <!-- Left outer arc -->
    <path d="M 13,65 C 17.5,71.5 23.5,74 30,74" fill="none" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round" />
    <!-- Right outer arc -->
    <path d="M 30,74 C 36.5,74 42.5,71.5 47,65" fill="none" stroke="#b45309" stroke-width="3.5" stroke-linecap="round" />
  </g>

  <!-- Inner Ripple Arc -->
  <g>
    <!-- Left inner arc -->
    <path d="M 20,62 C 23,65.5 26.2,67 30,67" fill="none" stroke="#f59e0b" stroke-width="2.8" stroke-linecap="round" />
    <!-- Right inner arc -->
    <path d="M 30,67 C 33.8,67 37,65.5 40,62" fill="none" stroke="#b45309" stroke-width="2.8" stroke-linecap="round" />
  </g>

  <!-- Pin Teardrop Body with Drop Shadow -->
  <g filter="url(#pin-drop-shadow-amber)">
    <!-- Left Half (Bright Amber #f59e0b) -->
    <path d="M 30,6 C 20.06,6 12,14.06 12,24 C 12,35.5 22.5,48.5 30,58 L 30,6 Z" fill="#f59e0b" />
    <!-- Right Half (Shaded Amber #b45309) -->
    <path d="M 30,6 C 39.94,6 48,14.06 48,24 C 48,35.5 37.5,48.5 30,58 L 30,6 Z" fill="#b45309" />

    <!-- Center White Target Cutout Ring -->
    <circle cx="30" cy="24" r="8.5" fill="none" stroke="#ffffff" stroke-width="3.2" />
  </g>
</svg>
